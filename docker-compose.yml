services:
  builder:
    build:
      context: .
      target: build # just build/publish
    container_name: blueboard-builder
    volumes:
      - ./Blueboard:/src/Blueboard
    command: ["echo", "Build complete"] # exits after build

  migrator:
    build:
      context: .
      target: sdk # SDK image for EF CLI
    container_name: blueboard-migrator
    depends_on:
      - db
    working_dir: /src/Blueboard
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    command: >
      /bin/sh -c "dotnet tool restore && dotnet ef database update"
    volumes:
      - ./Blueboard:/src/Blueboard
    restart: "no"

  blueboard:
    build:
      context: .
      target: final # runtime image
    container_name: blueboard-backend
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
    ports:
      - "${BLUEBOARD_PORT}:8080"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: blueboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
